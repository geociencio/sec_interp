<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SecInterp master icon (vector).

  Design: geological cross-section with folded strata (red/green/blue) and a
  section line, keeping the original "SEC / INTERP" wordmark and palette.

  Source-only master: the packaged plugin still uses the original icon.png
  (metadata.txt icon=icon.png). Exporting this SVG does not replace it.

  Export (128 px master, 64 px optional):
    rsvg-convert -w 128 -h 128 docs/source/images/sec_interp_icon.svg -o icon.png
    rsvg-convert -w 64  -h 64  docs/source/images/sec_interp_icon.svg -o icon_64.png
-->

