# ai-context-core (ai-ctx) project configuration — v5 (context-only).
#
# ai-ctx compiles / renders / verifies developer context. Quality metrics are
# single-sourced from qgis-plugin-analyzer (analysis_results/project_context.json).
# Curated architecture notes live in .ai-context/architecture_notes.md and are
# always embedded; the docs below are extra context.

context_docs = ["docs/CORE_DISTINCTION_GUIDE_EN.md"]

[context]
sections = ["structure", "metrics", "dependencies", "git"]
# Compact, unstyled dependency diagram (v5.1.0 default); set true to emit the
# classDef/class block, which dominates the artifact token count.
mermaid_style = false

# Keep the session bundle cheap (heuristic chars/4). Override with --max-tokens.
[context.budget]
max_tokens = 8000

[context.budget.sections]
structure = 2500
dependencies = 2500

[sources]
source = "external"
