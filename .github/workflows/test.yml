name: CI - Code Quality & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Run Ruff
        run: uvx ruff check .

  test:
    name: Tests (QGIS Headless)
    runs-on: ubuntu-latest
    needs: quality
    container:
      image: qgis/qgis:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update && apt-get install -y git curl ca-certificates libgl1 procps

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "/root/.cargo/bin" >> $GITHUB_PATH

    - name: Setup environment and dependencies
      run: |
        # Use system site packages to access QGIS libraries
        /root/.cargo/bin/uv venv --system-site-packages .venv
        echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
        . .venv/bin/activate
        uv pip install --no-build-isolation -e ".[dev]"

    - name: Run all tests (Unit + Integration)
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        . .venv/bin/activate
        python3 -m unittest discover tests
