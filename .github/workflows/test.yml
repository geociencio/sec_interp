name: CI - Code Quality & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Run Ruff
        run: uvx ruff check .

  qt6:
    name: Qt6 / QGIS 4 Enum Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Run PyQGIS 4 migration check
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqt6_checker.log .
          if [ -s pyqt6_checker.log ]; then
            cat pyqt6_checker.log
            echo "::error::Qt6/PyQt6 enum incompatibilities detected (see log above)."
            exit 1
          fi

      - name: Upload checker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyqgis4-checker-report
          path: pyqt6_checker.log
          retention-days: 7

  test:
    name: Tests (QGIS Headless)
    runs-on: ubuntu-latest
    needs: [quality, qt6]
    container:
      image: qgis/qgis:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update && apt-get install -y git curl ca-certificates libgl1 procps

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "/root/.cargo/bin" >> $GITHUB_PATH

    - name: Setup environment and dependencies
      run: |
        # Use system site packages to access QGIS libraries
        /root/.cargo/bin/uv venv --system-site-packages .venv
        echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
        . .venv/bin/activate
        uv pip install --no-build-isolation -e ".[dev]"

    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: ${{ github.workspace }}/..
        FORCE_MOCKS: "1"
      run: |
        . .venv/bin/activate
        python3 -m unittest discover tests/core
        python3 -m unittest discover tests/gui
        python3 -m unittest discover tests/exporters
        python3 -m unittest discover tests/benchmarks
        python3 -m unittest tests/test_translation_loading.py

    - name: Run Integration Tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: ${{ github.workspace }}/..
        FORCE_MOCKS: "0"
      run: |
        . .venv/bin/activate
        python3 -m unittest discover tests/integration
