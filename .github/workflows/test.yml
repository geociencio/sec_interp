name: CI - Code Quality & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Run Ruff
        run: uv run --frozen ruff check .

  docs:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run documentation checks
        run: python3 scripts/check_docs.py

  qt6:
    name: Qt6 / QGIS 4 Enum Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Run PyQGIS 4 migration check
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqt6_checker.log .
          if grep -q "Enum error" pyqt6_checker.log; then
            cat pyqt6_checker.log
            echo "::error::Qt6/PyQt6 enum incompatibilities detected (see log above)."
            exit 1
          fi
          echo "No Qt6/PyQt6 enum incompatibilities detected."

      - name: Upload checker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyqgis4-checker-report
          path: pyqt6_checker.log
          retention-days: 7

  test:
    name: Tests (QGIS Docker)
    runs-on: ubuntu-latest
    needs: [quality, qt6]

    steps:
    - uses: actions/checkout@v4

    - name: Build test image
      run: DOCKER_BUILDKIT=1 docker build -t sec_interp_test .

    - name: Run tests (QGIS headless)
      run: |
        set +e
        docker run --rm -v "$PWD":/app/sec_interp sec_interp_test > /tmp/tests.log 2>&1
        code=$?
        set -e
        tail -20 /tmp/tests.log
        if [ "$code" -eq 0 ]; then
          exit 0
        fi
        # Tolerate the known QGIS teardown segfault (139) only when every group
        # reported OK and nothing failed.
        if [ "$code" -eq 139 ] && grep -qE '^OK$' /tmp/tests.log && ! grep -qE '^(FAILED|ERROR)' /tmp/tests.log; then
          echo "::warning::Tolerated QGIS teardown segfault (exit 139) after all tests reported OK."
          exit 0
        fi
        echo "Test run failed (exit $code)."
        exit "$code"
