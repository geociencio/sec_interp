name: Scheduled Release

on:
  # Every Sunday at 15:00 UTC, publish the next release due in .release-queue.json.
  schedule:
    - cron: "0 15 * * 0"
  # Allow publishing a specific release on demand (empty = next due).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish now (e.g. 3.9.1). Empty = next due."
        required: false
        default: ""
      dry_run:
        description: "Build and test only; do not publish the release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish due release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Select due release
        id: pick
        run: |
          python3 scripts/next_scheduled_release.py "${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Nothing due
        if: ${{ steps.pick.outputs.version == '' }}
        run: echo "No scheduled release is due."

      # Keep the optimized docs/help tooling from the default branch so release
      # branches cut before the offline-help rework still build the optimized
      # manual. build_docs.sh alone is not enough: it drives main's conf.py
      # (SECINTERP_DOCS_HELP exclusion) and root_doc=help_index, and neither
      # conf.py nor help_index.rst exists on the older branches.
      - name: Cache main docs tooling
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          mkdir -p /tmp/main_docs
          cp scripts/build_docs.sh /tmp/build_docs.sh
          cp docs/source/conf.py /tmp/main_docs/conf.py
          cp docs/source/help_index.rst /tmp/main_docs/help_index.rst

      - name: Checkout release branch
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          # The release-train branches predate the `.agent` submodule conversion
          # on main (2026-10-08): there `.agent` is a regular directory, while the
          # checkout above populated it as a submodule. Without clearing it,
          # `git checkout` aborts with "untracked working tree files would be
          # overwritten" and the release never publishes. `.agent` is dev-only and
          # is never packaged, so materialising it from the branch is fine.
          git submodule deinit -f .agent || true
          rm -rf .agent
          git checkout -f "${{ steps.pick.outputs.branch }}"

      - name: Restore main docs tooling
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          cp /tmp/main_docs/conf.py docs/source/conf.py
          cp /tmp/main_docs/help_index.rst docs/source/help_index.rst

      # The release train must not publish code that the normal CI would reject.
      # Keep these gates before packaging; older release branches fall back to
      # the equivalent command when a newer Make target is not available.
      - name: Quality gates (lint, types, docs, security, i18n, analyzer)
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          set -euo pipefail
          uv run --frozen ruff check .
          UV_FROZEN=1 make mypy
          python3 scripts/check_docs.py
          make security-scan
          if grep -q '^i18n-check:' Makefile; then
            make i18n-check
          elif [ -f tests/core/test_i18n_catalogs.py ]; then
            uv run python3 -m unittest tests.core.test_i18n_catalogs
          fi
          uv run qgis-analyzer analyze . --max-cc 10

      - name: Run tests (Docker, QGIS headless)
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          DOCKER_BUILDKIT=1 docker build -t sec_interp_test .
          set +e
          docker run --rm -v "$PWD":/app/sec_interp sec_interp_test > /tmp/tests.log 2>&1
          code=$?
          set -e
          tail -20 /tmp/tests.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # Tolerate the known QGIS teardown segfault (139) only when every
          # group reported OK and nothing failed.
          if [ "$code" -eq 139 ] && grep -qE '^OK$' /tmp/tests.log && ! grep -qE '^(FAILED|ERROR)' /tmp/tests.log; then
            echo "::warning::Tolerated QGIS teardown segfault (exit 139) after all tests reported OK."
            exit 0
          fi
          echo "Test run failed (exit $code)."
          exit "$code"

      - name: Build offline help
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          mkdir -p help
          bash /tmp/build_docs.sh /tmp/sec_interp_docs

      - name: Build package
        if: ${{ steps.pick.outputs.version != '' }}
        run: |
          uv run qgis-manage package \
            --output dist \
            --repo-check \
            --stamp \
            --release-version "${{ steps.pick.outputs.version }}"

      - name: Publish GitHub release
        if: ${{ steps.pick.outputs.version != '' && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pick.outputs.version }}
          target_commitish: ${{ steps.pick.outputs.branch }}
          name: v${{ steps.pick.outputs.version }}
          body_path: docs/releases/notes/v${{ steps.pick.outputs.version }}.md
          files: dist/sec_interp.${{ steps.pick.outputs.version }}.zip
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
