[project]
name = "sec-interp"
version = "3.3.0"
description = "QGIS Plugin for geological interpretation and data extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-2.0-or-later" }

authors = [
    { name = "Juan M Bernales", email = "juanbernales@gmail.com" }
]
dependencies = [
    "ai-context-core>=3.3.0",
    "sphinx-intl>=2.3.2",
]

[project.urls]
Documentation = "https://geociencio.github.io/sec_interp_docs/"
Source = "https://github.com/geociencio/sec_interp"
Tracker = "https://github.com/geociencio/sec_interp/issues"

[tool.setuptools]
packages = ["core", "gui", "resources", "exporters", "i18n"]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "black==26.1.0",
    "mypy>=1.10",
    "networkx>=3.0",
    "ai-context-core>=3.3.0",
    "qgis-plugin-analyzer==1.10.1",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "myst-parser>=2.0.0",
    "linkify-it-py>=2.0.0",
    "qgis-manage>=0.6.4",
    "pre-commit>=4.5.1",
    "dominate>=2.9.1",
    "setuptools>=70.0.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.4.0",
    "flake8>=6.0.0",
    "flake8-json>=21.7.0",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
    "pytest-mock>=3.15.1",
    "qgis-stubs>=0.2.0.post1",
]

[tool.uv]
managed = true
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
    ".venv",
    "scripts",
    "venv",
    "env",
    ".env",
    "dist",
    "build",
    ".mypy_cache",
    ".ruff_cache",
    ".ruff_cache",
    "*.egg-info",
    "help",
    "resources/resources.py",
    "gui/ui/__init__.py",
    "**/migrations/**",
    "**/test*.py",
    "**/*test.py",
    "tests/",
    "research/",
    ".gemini-temp",
    ".ai-context",
]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ISC", # flake8-implicit-str-concat
    "Q",   # flake8-quotes
    "TID", # flake8-tidy-imports
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
    "C90", # mccabe
]
ignore = [
    "E501", "E402", "PLC0415", "PTH", "E722",
    "F821", "N802", "N803", "N806", "N815",
    "ISC001",
    "D203", "D213", "D205",
    "TRY003", "TRY300", "TRY301", "TRY401", "RUF001", "RUF012", "RUF100", "SIM102", "PLW0603", "PLW2901", "PLC0206", "T201", "E741", "N818",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"gui/**/*.py" = ["N802", "N803", "N806", "N815"]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "PLR2004", "S101"]
"logger_config.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 20
max-returns = 10
max-statements = 60

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "qgis.*",
    "PyQt5.*",
    "psutil.*",
    "networkx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sec_interp.core.*",
    "sec_interp.exporters.*",
]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["core", "exporters", "gui", "sec_interp_plugin.py"]
omit = [
    "tests/*",
    "scripts/*",
    "resources/resources.py",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
